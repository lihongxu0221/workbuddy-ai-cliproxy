# CLIProxyAPI 宿主配置文件样例 (嵌入 WorkBuddy AI 插件)
port: 8317
auth-dir: "auths"

# 基础模型请求日志配置
request-log: true

# 远程管理配置 (Management API)
remote-management:
  allow-remote: true
  secret-key: "YourSuperSecretManagementKey"

# 插件系统全局配置
plugins:
  enabled: true
  # 插件私有配置字典 (key 对应插件的 PluginID: "workbuddy")
  configs:
    workbuddy:
      # 国际区每日 30 积分成长中心自动打卡 (08:00/12:00/16:00/20:00 4-Tick)
      daily_bonus: true
      # 国内区每日 100 积分自动签到 (09:00/21:00)
      checkin_auto: true
      # 单账号最大活跃并发数 (严防上游 429 封号，建议 2)
      max_concurrency: 2
      # 国内区模型路由前缀 (请求 cn/glm-5.3 会强制使用 CN 账号)
      cn_prefix: "cn/"
      # 国际区模型路由前缀 (请求 cb/gpt-6.1-sol 会强制使用 Global 账号)
      global_prefix: "cb/"
      # 启用软会话粘性以保护 Prompt Cache，大幅降低 Token 扣费
      session_affinity: true
      # 是否在日志中记录去隐私的缓存命中追踪指纹 (日常建议 false)
      cache_trace: false
      # 插件本地数据持久化目录
      data_dir: ".codebuddy_data"
